<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay Iva in 0G</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1115; color: #e8e8ea; }
  main { max-width: 440px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.sub { color: #9aa0aa; margin: 0 0 24px; }
  .card { background: #181b22; border: 1px solid #262a33; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  label { display: block; color: #9aa0aa; font-size: 13px; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; font: inherit; font-size: 22px; padding: 10px 12px; border-radius: 10px; border: 1px solid #333846; background: #0f1115; color: inherit; }
  .hint { color: #9aa0aa; font-size: 13px; margin-top: 8px; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; text-align: center; font: inherit; font-weight: 600; padding: 14px; border-radius: 12px; border: 0; cursor: pointer; text-decoration: none; margin-top: 12px; }
  button { background: #f5a524; color: #111; }
  button:disabled { opacity: .5; cursor: default; }
  a.btn { background: #2a9df4; color: #fff; }
  a.ghost { background: transparent; border: 1px solid #333846; color: #e8e8ea; }
  code { font-size: 12px; word-break: break-all; color: #c8cbd2; }
  #status { min-height: 24px; margin-top: 12px; }
  .ok { color: #4ade80; } .err { color: #f87171; }
</style>
</head>
<body>
<main>
  <h1>🧺 Pay Iva</h1>
  <p class="sub">Iva hunts the cheapest groceries across Blinkit, Instamart and Zepto. Your 0G goes into her wallet, and she uses it to pay for her own brain on 0G Compute.</p>

  <div class="card">
    <label for="amount">Amount (0G)</label>
    <input id="amount" type="number" min="0.2" step="0.2" value="1">
    <div class="hint" id="hunts"></div>
    <button id="pay">Connect wallet &amp; pay</button>
    <a class="btn ghost" id="mm" style="display:none">Open in MetaMask app</a>
    <div id="status"></div>
  </div>

  <div class="card" id="done" style="display:none">
    <div class="ok">✅ Paid. One more tap:</div>
    <a class="btn" id="back">Return to Iva on Telegram</a>
    <div class="hint">Transaction: <a id="txlink" target="_blank" rel="noopener"><code id="tx"></code></a></div>
  </div>

  <div class="card">
    <div class="hint">Network: <b>0G Mainnet</b> (chain 16661). Iva's wallet:<br><code id="to"></code></div>
  </div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const TO = q.get('to') || '0xbbd2beC1DFd26272c171d174BeEb4eE0488b918d';
  const BOT = q.get('bot') || 'IvaGroceryAgentbot';
  const FEE = Number(q.get('fee') || 0.2);
  const CHAIN = { chainId: '0x4115', chainName: '0G Mainnet', nativeCurrency: { name: '0G', symbol: '0G', decimals: 18 },
    rpcUrls: ['https://evmrpc.0g.ai'], blockExplorerUrls: ['https://chainscan.0g.ai'] };
  const $ = (id) => document.getElementById(id);
  $('to').textContent = TO;
  if (q.get('amount')) $('amount').value = q.get('amount');
  const showHunts = () => { $('hunts').textContent = `= ${Math.floor(Number($('amount').value) / FEE + 1e-9)} hunts at ${FEE} 0G each`; };
  $('amount').oninput = showHunts; showHunts();
  const status = (t, cls = '') => { $('status').className = cls; $('status').textContent = t; };

  if (!window.ethereum) {
    $('mm').style.display = 'block';
    $('mm').href = 'https://metamask.app.link/dapp/' + location.href.replace(/^https?:\/\//, '');
    status('No wallet found in this browser. Open this page in MetaMask (or any EVM wallet browser).');
  }

  function toWeiHex(x) {
    const [i, f = ''] = String(x).split('.');
    return '0x' + (BigInt(i || '0') * 10n ** 18n + BigInt((f + '0'.repeat(18)).slice(0, 18))).toString(16);
  }

  $('pay').onclick = async () => {
    const amount = Number($('amount').value);
    if (!(amount > 0)) return status('Enter an amount.', 'err');
    if (!window.ethereum) return status('No wallet in this browser.', 'err');
    $('pay').disabled = true;
    try {
      status('Connecting wallet…');
      const [from] = await ethereum.request({ method: 'eth_requestAccounts' });
      try {
        await ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN.chainId }] });
      } catch (e) {
        if (e.code === 4902 || /unrecognized|not added/i.test(e.message)) {
          await ethereum.request({ method: 'wallet_addEthereumChain', params: [CHAIN] });
        } else throw e;
      }
      status('Confirm the payment in your wallet…');
      const hash = await ethereum.request({ method: 'eth_sendTransaction', params: [{ from, to: TO, value: toWeiHex($('amount').value) }] });
      status('Sent. Iva will verify it onchain.', 'ok');
      $('done').style.display = 'block';
      $('tx').textContent = hash;
      $('txlink').href = 'https://chainscan.0g.ai/tx/' + hash;
      $('back').href = `https://t.me/${BOT}?start=${hash.replace(/^0x/, '')}`;
    } catch (e) {
      status(e.message || String(e), 'err');
    } finally {
      $('pay').disabled = false;
    }
  };
</script>
</body>
</html>
